<!DOCTYPE html>
<html>
<head>
    <title>Jokatim Admin (Secure)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body{ font-family:Arial; background:#f2f2f2; padding:15px; margin:0; }
        .card{ background:white; padding:15px; border-radius:8px; margin:10px auto; max-width:400px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
        input,select,button{ width:100%; padding:12px; margin:8px 0; border:1px solid #ccc; border-radius:5px; box-sizing:border-box; }
        button{ background:black; color:white; border:none; cursor:pointer; font-weight:bold; }
        .delete-btn { background: #ff4444; margin-top: 5px; padding: 8px; font-size: 12px; }
        .hidden{ display:none !important; }
        #status { font-size:12px; color:blue; text-align:center; margin-bottom:10px; }
        .product-item { border-bottom: 1px solid #eee; padding: 10px 0; }
    </style>
</head>
<body>

<div id="loginBox" class="card">
    <h2>Admin Login</h2>
    <p style="font-size: 12px; color: #666;">Paste your GitHub Personal Access Token below to manage products.</p>
    <input id="adminToken" type="password" placeholder="ghp_xxxx or github_pat_xxxx">
    <button onclick="login()">Access Control Panel</button>
</div>

<div id="panel" class="card hidden">
    <h2>Jokatim Control</h2>
    <div id="status">Ready</div>

    <h3>Add New Product</h3>
    <input id="name" placeholder="Product name">
    <input id="price" type="number" placeholder="Price (#)">
    <select id="category">
        <option value="clothes">Clothes</option>
        <option value="wine">Wine</option>
    </select>
    <input id="imgUrl" placeholder="Image URL">
    <button id="saveBtn" onclick="saveProduct()">Save to GitHub</button>

    <hr>
    <h3>Current Products</h3>
    <div id="productList">Loading products...</div>
    
    <button onclick="location.reload()" style="background:gray;">Logout / Refresh</button>
</div>

<script>
    // --- CONFIGURATION ---
    const OWNER = "jokatim-ship-it";
    const REPO = "Jokatim";
    const PATH = "products.json";

    let GITHUB_TOKEN = "";
    let currentProducts = [];

    async function login() {
        const tokenInput = document.getElementById("adminToken").value.trim();
        if(!tokenInput) return alert("Please enter your GitHub Token.");
        
        GITHUB_TOKEN = tokenInput;
        
        // Test the token by trying to fetch products
        const success = await fetchProducts();
        if(success) {
            document.getElementById("loginBox").classList.add("hidden");
            document.getElementById("panel").classList.remove("hidden");
        } else {
            alert("Login Failed: Check your token and ensure it has 'repo' permissions.");
        }
    }

    async function fetchProducts() {
        try {
            const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;
            const res = await fetch(url + "?t=" + Date.now(), { 
                headers: { "Authorization": `token ${GITHUB_TOKEN}` } 
            });
            
            if(!res.ok) return false;

            const data = await res.json();
            currentProducts = JSON.parse(atob(data.content));
            renderList();
            return true;
        } catch (e) { 
            return false;
        }
    }

    function renderList() {
        const list = document.getElementById("productList");
        list.innerHTML = currentProducts.length === 0 ? "No products found." : "";
        currentProducts.forEach((p, index) => {
            list.innerHTML += `
                <div class="product-item">
                    <b>${p.name}</b> (#${p.price}) - <small>${p.category}</small>
                    <button class="delete-btn" onclick="deleteProduct(${index})">Delete Item</button>
                </div>`;
        });
    }

    async function saveProduct() {
        const name = document.getElementById("name").value;
        const price = document.getElementById("price").value;
        const category = document.getElementById("category").value;
        const image_url = document.getElementById("imgUrl").value;

        if(!name || !price || !image_url) return alert("Fill all fields");
        
        const newProduct = { id: Date.now(), name, price, category, image_url };
        const updatedList = [...currentProducts, newProduct];
        await uploadToGitHub(updatedList, "Added " + name);
    }

    async function deleteProduct(index) {
        if(!confirm("Delete this item?")) return;
        const itemToDelete = currentProducts[index].name;
        currentProducts.splice(index, 1);
        await uploadToGitHub(currentProducts, "Deleted " + itemToDelete);
    }

    async function uploadToGitHub(list, msg) {
        const status = document.getElementById("status");
        status.innerText = "Syncing with GitHub...";
        try {
            const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;
            const res = await fetch(url, { headers: { "Authorization": `token ${GITHUB_TOKEN}` } });
            const data = await res.json();

            const update = await fetch(url, {
                method: "PUT",
                headers: { "Authorization": `token ${GITHUB_TOKEN}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: msg,
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(list, null, 2)))),
                    sha: data.sha
                })
            });

            if(update.ok) {
                alert("Success!");
                fetchProducts(); 
            } else {
                alert("Upload failed. Check token permissions.");
            }
        } catch (err) { alert("GitHub Error"); }
        status.innerText = "Ready";
    }
</script>
</body>
</html>
